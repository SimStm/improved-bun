name: Check Bun Base Image Update

on:
  schedule:
    # A cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

# GITHUB_TOKEN sozinho: push não dispara outros workflows (evita loops).
# PAT_REPO no checkout: o push passa a disparar Docker Image CI como qualquer push humano.
# Sem PAT: após o push, disparamos workflow_dispatch com gh (precisa actions: write).
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_REPO || github.token }}

      # Usa a Registry HTTP API v2 (registry-1.docker.io), mesma fonte do `docker pull`.
      # A API REST hub.docker.com/v2/repositories/.../tags pode expor digest defasado ou
      # incompatível com o manifest real; o header Docker-Content-Digest é o valor correto.
      - name: Fetch registry digest for oven/bun:latest
        id: fetch
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:oven/bun:pull" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Failed to obtain anonymous registry token"
            exit 1
          fi
          HEADERS=$(curl -fsSLI \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://registry-1.docker.io/v2/oven/bun/manifests/latest")
          DIGEST=$(echo "$HEADERS" | tr -d '\r' | grep -i '^docker-content-digest:' | awk '{print $2}' | head -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::No Docker-Content-Digest in registry response"
            echo "$HEADERS" | head -c 4000
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Registry oven/bun:latest manifest digest: ${DIGEST}"

      - name: Compare with stored digest
        id: compare
        run: |
          STORED=$(cat .github/bun-base-digest 2>/dev/null | tr -d '\n\r' || echo "")
          CURRENT="${{ steps.fetch.outputs.digest }}"
          if [ -z "$STORED" ] || [ "$STORED" != "$CURRENT" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Bun base manifest changed. Stored: ${STORED:-<empty>} | Current: ${CURRENT}"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No change (digest matches registry manifest)"
          fi

      - name: Update digest and push
        if: steps.compare.outputs.changed == 'true'
        id: digestpush
        run: |
          echo "${{ steps.fetch.outputs.digest }}" > .github/bun-base-digest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/bun-base-digest
          git commit -m "chore: sync bun base digest from registry-1.docker.io"
          git push

      # Commits feitos só com GITHUB_TOKEN não geram evento push que dispare outros workflows.
      # Com PAT no checkout, o push acima já dispara Docker Image CI.
      # Sem PAT: forçamos workflow_dispatch (documentação: às vezes ainda exige PAT para disparar de workflow → workflow).
      - name: Trigger Docker Image CI if push did not use PAT
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_REPO: ${{ secrets.PAT_REPO }}
        run: |
          if [ -n "$PAT_REPO" ]; then
            echo "PAT_REPO is set: push used a personal token; Docker Image CI should run from the push event."
            exit 0
          fi
          echo "No PAT_REPO: dispatching Docker Image CI via workflow_dispatch..."
          gh workflow run docker-image.yml --ref "${{ github.ref_name }}"
